name: CI

on:
  # Only `main` needs a push trigger. Feature branches are covered by the
  # pull_request trigger; keeping `branches: ['**']` here made every PR run
  # the whole matrix twice — once for the push, once for the PR.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the supported floor declared in package.json engines; 22 is the
        # active LTS. Both must stay green — better-sqlite3 is the constraint.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      # The phone module is held at 100% branch coverage; the threshold lives in
      # vitest.config.ts and this step is what enforces it.
      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build
